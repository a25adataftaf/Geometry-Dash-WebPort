# Publica la web en GitHub Pages cada vez que hay un push a main.
#
# No hay nada que compilar: se sube la carpeta del repositorio tal cual
# (index.html, styles.css, app.js, favicon.svg, fuentes/ y play/).
# Los ~370 MB de datos del juego no están aquí: se piden al CDN de GitHub.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar los ficheros de la web
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='geo' --exclude='dist' ./ dist/

      - name: Empaquetar
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: desplegar
        uses: actions/deploy-pages@v4
